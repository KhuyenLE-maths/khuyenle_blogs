<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site_name }}{% endblock %}</title>
<meta name="description" content="{% block description %}Evidence-backed notes on new open-weight LLM and VLM releases. Every fact shows its source and verification status.{% endblock %}">
<link rel="canonical" href="{{ base_url }}{{ page_path }}">
<meta property="og:site_name" content="{{ site_name }}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:type" content="{% block og_type %}website{% endblock %}">
<meta property="og:url" content="{{ base_url }}{{ page_path }}">
<link rel="alternate" type="application/rss+xml" title="{{ site_name }}" href="{{ base_path }}/feed.xml">
<link rel="stylesheet" href="{{ base_path }}/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="{{ base_path }}/">{{ site_name }}</a>
    <nav>
      <a href="{{ base_path }}/models/">Models</a>
      <a href="{{ base_path }}/methodology/">Methodology</a>
      <a href="{{ base_path }}/feed.xml">RSS</a>
    </nav>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <div class="wrap">
    Built {{ generated_at }} UTC. Every fact links to its source and shows its verification status.
    <a href="{{ base_path }}/methodology/">How this works</a>.
  </div>
</footer>
</body>
</html>
