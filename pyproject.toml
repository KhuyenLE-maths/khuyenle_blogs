[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelscopex"
version = "0.1.0"
description = "Evidence-backed tracker for open-weight LLM/VLM releases, published as a static blog."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "huggingface_hub>=0.24",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
msx = "msx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
  "network: hits the live Hugging Face API (skipped by default; run with: pytest -m network)",
]
